<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G検定アプリ v5.3 最新版へ更新中...</title>
  <style>
    body {
      background: #020617;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #0f172a;
      border: 1px solid #0284c7;
      border-radius: 16px;
      padding: 28px 24px;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(2, 132, 199, 0.25);
    }
    h1 {
      font-size: 18px;
      color: #38bdf8;
      margin: 0 0 12px;
    }
    p {
      font-size: 14px;
      color: #cbd5e1;
      line-height: 1.6;
      margin: 0 0 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔄 G検定 絶対合格プログラム v5.4</h1>
    <p>スマホ内の古いキャッシュを消去し、最新の v5.4（文章追従ハイライト・日本語発音完全対応版）へ切り替えています...</p>
  </div>
  <script>
    (async function() {
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          for (const r of regs) {
            await r.unregister();
          }
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          for (const k of keys) {
            await caches.delete(k);
          }
        }
      } catch (e) {
        console.warn(e);
      }
      setTimeout(() => {
        window.location.replace('./index.html?v=5.4&t=' + Date.now());
      }, 300);
    })();
  </script>
</body>
</html>
