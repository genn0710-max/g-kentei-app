  <line x1="372" y1="180" x2="256" y2="120" stroke="rgba(255,255,255,0.2)" stroke-width="4"/>
  <line x1="140" y1="332" x2="256" y2="392" stroke="rgba(255,255,255,0.2)" stroke-width="4"/>
  <line x1="372" y1="332" x2="256" y2="392" stroke="rgba(255,255,255,0.2)" stroke-width="4"/>
  <!-- ノード -->
  <circle cx="256" cy="120" r="16" fill="url(#glow)"/>
  <circle cx="140" cy="180" r="12" fill="url(#glow)"/>
  <circle cx="372" cy="180" r="12" fill="url(#glow)"/>
  <circle cx="140" cy="332" r="12" fill="url(#glow)"/>
  <circle cx="372" cy="332" r="12" fill="url(#glow)"/>
