<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G検定アプリ スマホ登録用QRコード（モバイル完全最適化版）</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      background: #ffffff;
      border-radius: 24px;
      padding: 36px 32px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 440px;
      width: 100%;
      border: 1px solid #e2e8f0;
    }
    .badge {
      background: #2563eb;
      color: #fff;
      font-weight: 700;
      display: inline-block;
      padding: 5px 12px;
      border-radius: 9999px;
      font-size: 0.82rem;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }
    .status-badge {
      background: #dcfce7;
      color: #166534;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      margin-left: 6px;
    }
    h1 {
      font-size: 1.35rem;
      color: #0f172a;
      margin: 0 0 8px 0;
    }
    p {
      color: #64748b;
      font-size: 0.92rem;
      margin: 0 0 20px 0;
      line-height: 1.5;
    }
    .qr-frame {
      background: #ffffff;
      padding: 18px;
      border-radius: 20px;
      display: inline-block;
      border: 2px solid #cbd5e1;
      margin-bottom: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
    }
    .qr-frame svg {
      width: 260px;
      height: 260px;
      display: block;
    }
    .url-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .url-text {
      color: #1d4ed8;
      font-size: 0.85rem;
      word-break: break-all;
      font-family: monospace;
      font-weight: 600;
      text-decoration: none;
      text-align: left;
    }
    .copy-btn {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }
    .copy-btn:hover { background: #1d4ed8; }
    .steps {
      text-align: left;
      background: #f8fafc;
      padding: 18px;
      border-radius: 14px;
      font-size: 0.88rem;
      color: #334155;
      line-height: 1.7;
      border: 1px solid #e2e8f0;
    }
    .steps-title {
      font-weight: 700;
      margin-bottom: 8px;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .step-item { margin-bottom: 5px; }
    .step-note {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #e2e8f0;
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
